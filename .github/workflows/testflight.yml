name: Build Signed Settings-iOS IPA and Upload to TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Validate and upload the exported IPA to App Store Connect
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: settings-testflight-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_PATH: Preferences.xcodeproj
  WORKSPACE_PATH: Preferences.xcodeproj/project.xcworkspace
  SCHEME: Preferences
  TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  APP_BUNDLE_ID: com.itorah.settings
  SHARED_APP_GROUP: group.com.itorah.shared
  BUILD_DIR: ${{ github.workspace }}/build/signed-ios

jobs:
  build-sign-and-upload:
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          selected_xcode="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' | sort -V | tail -1)"
          if [ -n "$selected_xcode" ]; then
            echo "Selecting $selected_xcode"
            sudo xcode-select -s "$selected_xcode/Contents/Developer"
          fi
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Run SharedSettingsKit Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path SharedSettingsKit

      - name: Compute build number
        shell: bash
        run: |
          build_number=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Using CFBundleVersion $build_number"

      - name: Restore App Store Connect API key
        if: ${{ github.event_name == 'push' || inputs.upload_to_testflight }}
        shell: bash
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID_VALUE: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID_VALUE: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          for required in ASC_KEY_P8_B64 ASC_KEY_ID_VALUE ASC_ISSUER_ID_VALUE; do
            test -n "${!required:-}" || { echo "::error::Missing signing secret $required"; exit 1; }
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$HOME/.private_keys"
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID_VALUE}.p8"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$key_path"
          cp "$key_path" "$HOME/.private_keys/AuthKey_${ASC_KEY_ID_VALUE}.p8"
          chmod 600 "$key_path" "$HOME/.private_keys/AuthKey_${ASC_KEY_ID_VALUE}.p8"
          echo "ASC_KEY_ID=$ASC_KEY_ID_VALUE" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_VALUE" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Import distribution certificate and provisioning profile
        shell: bash
        env:
          CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_P12_B64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MAIN_PROFILE_B64: ${{ secrets.APPLE_MAIN_PROVISIONING_PROFILE_B64 }}
        run: |
          set -Eeuo pipefail
          for required in TEAM_ID CERTIFICATE_B64 CERTIFICATE_PASSWORD MAIN_PROFILE_B64; do
            test -n "${!required:-}" || { echo "::error::Missing signing secret $required"; exit 1; }
          done

          keychain="$RUNNER_TEMP/settings-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/apple-distribution.p12"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$BUILD_DIR/logs"
          printf '%s' "$CERTIFICATE_B64" | base64 --decode > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep 'Apple Distribution'

          profile="$RUNNER_TEMP/main.mobileprovision"
          plist="$BUILD_DIR/logs/main-profile.plist"
          printf '%s' "$MAIN_PROFILE_B64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$plist")
          app_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")
          get_task_allow=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$plist")
          test "$team" = "$TEAM_ID"
          test "$app_identifier" = "$TEAM_ID.$APP_BUNDLE_ID"
          test "$get_task_allow" = false
          ! /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$plist" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$plist" >/dev/null 2>&1

          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "MAIN_PROFILE_SPECIFIER=$name" >> "$GITHUB_ENV"
          echo "MAIN_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "Installed App Store profile '$name' ($uuid)"

      - name: Preflight build settings check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_DIR/logs"
          log="$BUILD_DIR/logs/preflight-settings.log"
          xcodebuild -workspace "$WORKSPACE_PATH" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            'CODE_SIGN_IDENTITY=Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$MAIN_PROFILE_SPECIFIER" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -showBuildSettings | tee "$log"
          grep -E "^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = $APP_BUNDLE_ID$" "$log"
          grep -E "^[[:space:]]*DEVELOPMENT_TEAM = $TEAM_ID$" "$log"

      - name: Archive signed Release app
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$BUILD_DIR/DerivedData" "$BUILD_DIR/logs"
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$BUILD_DIR/Settings.xcarchive" \
            -derivedDataPath "$BUILD_DIR/DerivedData" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$MAIN_PROFILE_SPECIFIER" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="1.0.0" \
            | tee "$BUILD_DIR/logs/archive.log"

      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>$APP_BUNDLE_ID</key><string>$MAIN_PROFILE_SPECIFIER</string>
            </dict>
          </dict></plist>
          PLIST
          plutil -lint "$export_options"
          mkdir -p "$BUILD_DIR/export"
          xcodebuild -exportArchive \
            -archivePath "$BUILD_DIR/Settings.xcarchive" \
            -exportPath "$BUILD_DIR/export" \
            -exportOptionsPlist "$export_options" \
            | tee "$BUILD_DIR/logs/export.log"
          raw_ipa=$(find "$BUILD_DIR/export" -maxdepth 1 -type f -name '*.ipa' -print -quit)
          test -s "$raw_ipa"
          final_ipa="$BUILD_DIR/export/Settings-$BUILD_NUMBER.ipa"
          mv "$raw_ipa" "$final_ipa"
          echo "IPA_PATH=$final_ipa" >> "$GITHUB_ENV"
          shasum -a 256 "$final_ipa" | tee "$final_ipa.sha256"

      - name: Verify archive, signatures, and entitlements
        shell: bash
        run: |
          set -Eeuo pipefail
          verify_dir="$RUNNER_TEMP/verify-ipa"
          ditto -x -k "$IPA_PATH" "$verify_dir"
          app=$(find "$verify_dir/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = "$APP_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist")" = Settings
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$BUILD_NUMBER"
          codesign --verify --deep --strict --verbose=2 "$app"

          entitlements="$BUILD_DIR/logs/signed-entitlements.plist"
          profile="$BUILD_DIR/logs/embedded-profile.plist"
          codesign --display --entitlements - --xml "$app" > "$entitlements"
          security cms -D -i "$app/embedded.mobileprovision" > "$profile"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$entitlements")" = "$TEAM_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$entitlements")" = "$TEAM_ID.$APP_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile")" = "$TEAM_ID.$APP_BUNDLE_ID"
          echo "Signed IPA verification passed for $app"

      - name: Validate with App Store Connect
        if: ${{ github.event_name == 'push' || inputs.upload_to_testflight }}
        run: |
          xcrun altool --validate-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect and TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload_to_testflight }}
        run: |
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Verify uploaded build appears in TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload_to_testflight }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet 'PyJWT[crypto]==2.10.1'
          "$RUNNER_TEMP/asc-venv/bin/python" utilities/scripts/verify-testflight-build.py "$BUILD_NUMBER"

      - name: Upload signed IPA and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Settings-signed-ipa-${{ env.BUILD_NUMBER }}
          path: |
            ${{ env.IPA_PATH }}
            ${{ env.IPA_PATH }}.sha256
            ${{ env.BUILD_DIR }}/Settings.xcarchive/dSYMs
            ${{ env.BUILD_DIR }}/logs
          if-no-files-found: warn
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${MAIN_PROFILE_UUID:-missing}.mobileprovision"
          rm -f "${ASC_KEY_PATH:-$RUNNER_TEMP/missing-asc-key}"
